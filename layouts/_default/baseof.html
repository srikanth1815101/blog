<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}" data-theme="light" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Description }}{{ end }}">
    
    <!-- Favicons and Site Icons for SEO & PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    animation: {
                        'fade-in': 'fadeIn 1s ease-in',
                        'slide-up': 'slideUp 0.7s cubic-bezier(.39,.575,.565,1.000)'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(40px)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <style>
        html { font-family: 'Inter', system-ui, sans-serif; }
        .prose {
            max-width: 65ch;
            margin: 0 auto;
        }
        
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
            font-weight: 600;
            line-height: 1.25;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        
        .prose h1 { font-size: 2.25rem; }
        .prose h2 { font-size: 1.875rem; }
        .prose h3 { font-size: 1.5rem; }
        .prose h4 { font-size: 1.25rem; }
        
        .prose p {
            margin-bottom: 1.25rem;
            line-height: 1.75;
        }
        
        .prose code {
            background: rgb(243 244 246);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-size: 0.95em;
            color: rgb(17 24 39); /* dark text for inline code in light mode */
        }
        .dark .prose code {
            background: rgb(55 65 81);
            color: rgb(243 244 246); /* light text for inline code in dark mode */
        }
        .prose pre {
            background: rgb(17 24 39);
            color: rgb(243 244 246);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1.5rem 0;
        }
        .prose pre code {
            background: transparent;
            color: rgb(243 244 246);
            padding: 0;
        }
        .dark .prose pre {
            background: rgb(17 24 39);
            color: rgb(243 244 246);
        }
        .dark .prose pre code {
            color: rgb(243 244 246);
        }
        
        .prose blockquote {
            border-left: 4px solid rgb(59 130 246);
            padding-left: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: rgb(107 114 128);
        }
        
        .prose ul, .prose ol {
            margin: 1.25rem 0;
            padding-left: 1.5rem;
        }
        
        .prose li {
            margin: 0.5rem 0;
        }
        
        .prose a {
            color: rgb(59 130 246);
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        
        .prose a:hover {
            color: rgb(37 99 235);
        }
        
        html[data-theme="dark"] body {
            background-color: #0A0E27;
            color: #E5E7EB;
        }

        html[data-theme="light"] body {
            background-color: #F8F9FA;
            color: #1F2937;
        }
    </style>
    <!-- Theme Script -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || (localStorage.getItem('darkMode') === 'true' || (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>
<body>
    {{ partial "header.html" . }}
    <main class="{{ if .IsHome }}min-h-screen{{ else }}pt-24 md:pt-28 min-h-screen{{ end }} relative z-10">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}

    <!-- JavaScript -->
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
